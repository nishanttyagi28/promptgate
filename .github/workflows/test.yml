name: Test Suite
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install fastapi uvicorn pydantic pytest httpx
      - run: python -m pytest -q --tb=short